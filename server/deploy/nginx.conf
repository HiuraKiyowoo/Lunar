# /etc/nginx/sites-available/lunar
# ganti lunar.zone.id dengan subdomain lu dari my.zone.id
server {
    listen 80;
    server_name lunar.zone.id;

    # kalau pakai certbot, baris 443 akan dibuat otomatis

    client_max_body_size 0;
    proxy_buffering off;      # penting untuk streaming video
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
    }
}
