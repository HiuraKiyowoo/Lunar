# /etc/nginx/sites-available/lunar
#
# Ganti api-lunar.zone.id dengan domainmu. Pemasang otomatis (deploy/install.sh)
# sudah mengganti baris ini sendiri.
server {
    listen 80;
    server_name api-lunar.zone.id;

    # kalau pakai certbot, blok 443 akan dibuat otomatis

    client_max_body_size 0;
    proxy_buffering off;          # penting untuk streaming video
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Connection "";

        # Jalur pemutar membuka Chromium dan bisa memakan 75 detik pada
        # permintaan pertama. Batas bawaan nginx (60 detik) akan memutus
        # permintaan itu, jadi batasnya dinaikkan.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
